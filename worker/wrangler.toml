name = "newsun-atendimento-api"
main = "src/index.js"
compatibility_date = "2026-08-30"
workers_dev = true

[observability]
enabled = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "newsun-atendimento"
database_id = "8a3eff25-2c5f-4a49-ba08-af8f78a0b483"
migrations_dir = "migrations"

[[vectorize]]
binding = "VECTORIZE"
index_name = "newsun-public-knowledge"

# R2 desativado para este teste inicial do MVP: a Cloudflare exige cartão
# cadastrado para habilitar o R2, mesmo dentro do plano gratuito. Sem este
# binding, o upload de conta pelo clipe fica indisponível (mensagem educada
# ao visitante), mas chat, RAG e handoff funcionam normalmente.
# Para ativar: rode `npx wrangler r2 bucket create newsun-atendimento-uploads`
# depois de habilitar o R2 no dashboard, e descomente as 3 linhas abaixo.
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "newsun-atendimento-uploads"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://lucianosbq.github.io"
MODEL_CHAT = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
MODEL_EMBEDDING = "@cf/baai/bge-m3"
META_GRAPH_VERSION = "v26.0"
TURNSTILE_REQUIRED = "true"
CHAT_RATE_LIMIT = "30"
CHAT_RATE_WINDOW_SECONDS = "600"
HANDOFF_RATE_LIMIT = "5"
HANDOFF_RATE_WINDOW_SECONDS = "3600"
SESSION_RATE_LIMIT = "8"
SESSION_RATE_WINDOW_SECONDS = "3600"
UPLOAD_RATE_LIMIT = "10"
UPLOAD_RATE_WINDOW_SECONDS = "3600"
BUSINESS_HOURS_START = "08:00"
BUSINESS_HOURS_END = "18:00"
BUSINESS_DAYS = "1,2,3,4,5"
BUSINESS_TZ_OFFSET_MINUTES = "-180"
HANDOFF_RETENTION_DAYS = "90"
RAG_TOP_K = "7"
RAG_MIN_SCORE = "0.45"
PUBLIC_KB_NAMESPACE = "public"
CONSENT_TEXT_VERSION = "2026-08-30-v1"
WHATSAPP_EMPLOYEE_TEMPLATE = "newsun_novo_atendimento_setor"
WHATSAPP_CUSTOMER_TEMPLATE = "newsun_atendimento_recebido"
WHATSAPP_LANGUAGE = "pt_BR"

[triggers]
crons = ["17 3 * * *"]
